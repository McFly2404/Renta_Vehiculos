{% extends "base.html" %}
{% load static %}

{% block title %}DriveNow — Iniciar sesión{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <a href="/" class="auth-card__back link-arrow" style="flex-direction:row-reverse;gap:.35rem">
      <span style="transform:scaleX(-1);display:inline-block">→</span> Volver al inicio
    </a>

    <div class="auth-card__logo">Drive<em>Now</em></div>
    <h1 class="auth-card__title">Iniciar sesión</h1>
    <p class="auth-card__sub">Ingresa tu ID de usuario para continuar.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="login_id">ID de Usuario</label>
        <input type="number" id="login_id" placeholder="Ej. 1" min="1" required autofocus />
      </div>

      <div class="alert alert--error"   id="alertLogin" hidden></div>
      <div class="alert alert--success" id="alertSuccess" hidden></div>

      <button type="submit" class="btn btn--full" id="btnLogin" style="margin-top:.5rem">
        <span class="btn__text">Entrar</span>
        <span class="btn__spinner" aria-hidden="true"></span>
      </button>
    </form>

    <p class="auth-card__footer">
      ¿No tienes cuenta?
      <a href="/registro/" style="color:var(--c-accent);font-weight:600">Crear cuenta</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
