# ── nginx.conf — Orquestador de tráfico (Strangler Pattern) ──────────────────
#
#   /api/v2/pagos/  →  Microservicio Flask  (puerto 5000)
#   todo lo demás   →  Monolito Django      (puerto 8000)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;

    # ── Microservicio Nuevo: Pagos (Strangler) ───────────────────────────────
    location /api/v2/pagos/ {
        proxy_pass         http://flask_pagos:5000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Health check del microservicio ───────────────────────────────────────
    location /api/v2/health/ {
        proxy_pass       http://flask_pagos:5000;
        proxy_set_header Host $host;
    }

    # ── Monolito Legacy: Django (todo lo demás) ──────────────────────────────
    location / {
        proxy_pass         http://django_web:8000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
