<!DOCTYPE html>
<html>
<head>
    <title>Crear Pago</title>
</head>
<body>

<h1>Crear Pago</h1>

<form method="post">
    {% csrf_token %}

    <label>Monto:</label><br>
    <input type="number" step="0.01" name="monto" required><br><br>

    <label>ID Reserva:</label><br>
    <input type="number" step="0.01" name="monto" required><br><br>

    <label>Fecha de Pago:</label><br>
    <input type="date" name="fecha_pago" required><br><br>

    <button type="submit">Crear Pago</button>
</form>

{% if pago_id %}
    <p>Pago creado con ID: {{ pago_id }}</p>
{% endif %}

</body>
</html>
