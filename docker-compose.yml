version: "3.9"

# ── DriveNow — Arquitectura Híbrida (Strangler Pattern) ──────────────────────
#
#   nginx          → Enruta el tráfico           (puerto 80)
#   django_web     → Monolito legacy             (/api/ y HTML)
#   flask_pagos    → Microservicio de pagos      (/api/v2/pagos/)
#   db             → PostgreSQL 15 compartida
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Base de datos ────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: drivenow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       drivenow
      POSTGRES_USER:     drivenow
      POSTGRES_PASSWORD: drivenow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U drivenow -d drivenow"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── Monolito Django ──────────────────────────────────────────────────────
  django_web:
    build: .
    container_name: drivenow_django
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    environment:
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_NAME:     drivenow
      DB_USER:     drivenow
      DB_PASSWORD: drivenow
      DJANGO_ENV:  development
    depends_on:
      db:
        condition: service_healthy

  # ── Microservicio Flask — Pagos (Strangler) ──────────────────────────────
  flask_pagos:
    build: ./flask_pagos
    container_name: drivenow_flask_pagos
    restart: unless-stopped
    environment:
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_NAME:     drivenow
      DB_USER:     drivenow
      DB_PASSWORD: drivenow
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx — Proxy / Orquestador de tráfico ──────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: drivenow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django_web
      - flask_pagos

volumes:
  postgres_data:
